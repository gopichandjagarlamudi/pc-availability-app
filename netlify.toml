[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/manager/export/rep-table"
  to = "/.netlify/functions/export-rep-table"
  status = 200

[[redirects]]
  from = "/manager/export/availability"
  to = "/.netlify/functions/export-availability"
  status = 200

[[redirects]]
  from = "/manager/reps"
  to = "/.netlify/functions/manager-reps"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
